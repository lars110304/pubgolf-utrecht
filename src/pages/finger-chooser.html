<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="description" content="Everybody puts a finger down. One finger gets chosen.">
  <title>Finger Chooser · Pubgolf Utrecht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@600&display=swap">
  <link rel="stylesheet" href="nav.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b12;
      --ink: #ffffff;
      --dim: #9d9cb3;
      --font: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      /* No scrolling, zooming, selection, callouts or tap flashes while playing. */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* The site nav sits on top; everything the game uses lives in .stage-wrap below it,
       so a finger can never land on a nav link by accident. */
    body {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(60% 45% at 50% 38%, rgba(104, 78, 190, .20), transparent 70%),
        radial-gradient(50% 40% at 15% 95%, rgba(40, 150, 200, .13), transparent 70%),
        radial-gradient(50% 40% at 90% 85%, rgba(220, 70, 150, .10), transparent 70%),
        var(--bg);
    }

    .site-nav { position: relative; top: auto; padding-top: env(safe-area-inset-top, 0px); }

    .stage-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* ---------- Heading / status ---------- */
    .hud {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      top: 44%;
      transform: translateY(-50%);
      padding: 0 20px;
      text-align: center;
      pointer-events: none;
      transition: top .6s cubic-bezier(.2, .8, .2, 1), transform .6s cubic-bezier(.2, .8, .2, 1);
    }

    body[data-state="active"] .hud,
    body[data-state="reveal"] .hud {
      top: 20px;
      transform: translateY(0);
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 13.5vw, 84px);
      text-wrap: balance;
      font-weight: 900;
      letter-spacing: -.045em;
      line-height: 1;
      background: linear-gradient(90deg, #ff5d7a, #ffb347, #f9f871, #5af0b0, #4cc9ff, #8b8dff, #d78bff, #ff5d7a);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 9s linear infinite;
      transition: font-size .6s cubic-bezier(.2, .8, .2, 1);
    }

    body[data-state="active"] h1,
    body[data-state="reveal"] h1 { font-size: 22px; letter-spacing: -.02em; }

    .sub {
      margin: 12px 0 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--dim);
      transition: opacity .35s ease;
    }

    .count {
      margin: 6px 0 0;
      min-height: 24px;
      font-size: 17px;
      font-weight: 700;
      transition: opacity .35s ease;
    }

    .timer {
      margin: 2px 0 0;
      min-height: 68px;
      font-size: 64px;
      font-weight: 900;
      line-height: 68px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 30px rgba(255, 255, 255, .35);
      transition: opacity .35s ease;
    }

    .timer.pop { animation: pop .45s cubic-bezier(.2, .9, .3, 1.2); }

    body[data-state="idle"] .count,
    body[data-state="idle"] .timer,
    body[data-state="reveal"] .sub,
    body[data-state="reveal"] .count,
    body[data-state="reveal"] .timer { opacity: 0; }

    .hint {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
      margin: 0;
      padding: 0 20px;
      text-align: center;
      font-size: 13px;
      color: #6f6e86;
      pointer-events: none;
      display: none;
    }

    /* Only shown on mouse-only devices, as a testing aid. */
    html.mouse-only body[data-state="idle"] .hint { display: block; }

    /* ---------- Reset ---------- */
    .reset {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
      transform: translateX(-50%) translateY(10px);
      padding: 10px 24px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 999px;
      background: rgba(255, 255, 255, .07);
      color: #d6d5e4;
      font: 700 14px/1 var(--font);
      letter-spacing: .02em;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      touch-action: manipulation;
      transition: opacity .4s ease, transform .4s ease, background .2s ease;
    }

    .reset.visible {
      opacity: .85;
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .reset:hover { background: rgba(255, 255, 255, .13); }
    .reset:active { transform: translateX(-50%) scale(.96); }
    .reset:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @keyframes shimmer { to { background-position: 200% 0; } }
    @keyframes pop {
      from { transform: scale(1.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
      .timer.pop { animation: none; }
    }
  </style>
</head>
<body data-state="idle">
<!-- @nav -->
<div class="stage-wrap" id="wrap">
  <canvas id="stage"></canvas>

  <main class="hud">
    <h1>Finger Chooser</h1>
    <p class="sub" id="sub">Put a finger on the screen to begin</p>
    <p class="count" id="count"></p>
    <p class="timer" id="timer"></p>
  </main>

  <p class="hint" id="hint">Testing with a mouse? Click to add a finger, click it again to remove it.</p>
  <button class="reset" id="reset" type="button">Reset</button>
</div>
  <div class="sr" id="sr" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    // ------------------------------------------------------------------
    // Config
    // ------------------------------------------------------------------
    const MAX_TOUCHES  = 10;     // upper bound; the device may support fewer
    const MIN_TOUCHES  = 2;      // needed before the countdown starts
    const COUNTDOWN_MS = 3000;
    const TAU = Math.PI * 2;
    const FONT = 'ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", "Nunito", "Segoe UI", system-ui, sans-serif';
    // Ten clearly different, bright hues. Every active finger gets its own.
    const HUES = [350, 24, 48, 100, 150, 188, 215, 255, 285, 318];
    const PHRASES = ["You're it!", 'Loser!'];

    // ------------------------------------------------------------------
    // DOM
    // ------------------------------------------------------------------
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const subEl = document.getElementById('sub');
    const countEl = document.getElementById('count');
    const timerEl = document.getElementById('timer');
    const resetBtn = document.getElementById('reset');
    const srEl = document.getElementById('sr');

    // ------------------------------------------------------------------
    // State
    // ------------------------------------------------------------------
    // key -> { key, x, y, dx, dy, hueIdx, placedAt, seq, born, ph, virtual }
    // x/y is where the finger is; dx/dy is the smoothed position that gets drawn.
    const touches = new Map();
    let seqCounter = 0;          // strictly increasing per placement (tie-breaker)
    let phase = 'idle';          // 'idle' | 'counting' | 'reveal'
    let countdownStart = 0;
    let shownDigit = null;
    let reveal = null;           // set once the countdown ends
    let ghosts = [];             // circles of lifted fingers, fading out
    let particles = [];
    let rings = [];
    let flash = null;
    let idleAlpha = 1;
    let drag = null;             // mouse-only: { key, moved, isNew }
    let mouseSeq = 0;

    let W = 0, H = 0, R = 50;    // viewport size, base circle radius

    const AMBIENT = [
      { fx: .16, fy: .18, r: 36, hue: 285, ph: 0.0 },
      { fx: .84, fy: .24, r: 46, hue: 188, ph: 1.3 },
      { fx: .10, fy: .70, r: 52, hue: 24,  ph: 2.1 },
      { fx: .88, fy: .74, r: 38, hue: 350, ph: 3.4 },
      { fx: .52, fy: .90, r: 44, hue: 100, ph: 4.2 },
      { fx: .72, fy: .60, r: 28, hue: 255, ph: 5.0 }
    ];

    // ------------------------------------------------------------------
    // Small helpers
    // ------------------------------------------------------------------
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    const hsl = (h, s, l, a = 1) => `hsla(${(((h % 360) + 360) % 360).toFixed(1)},${s}%,${l}%,${a})`;
    const rand = (a, b) => a + Math.random() * (b - a);
    const buzz = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* ignore */ } };

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function pickHueIdx() {
      const used = new Set([...touches.values()].map((t) => t.hueIdx));
      const free = HUES.map((_, i) => i).filter((i) => !used.has(i));
      const pool = free.length ? free : HUES.map((_, i) => i);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // ------------------------------------------------------------------
    // Layout
    // ------------------------------------------------------------------
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      // The canvas fills the area below the site nav, so measure it rather than the window.
      const box = canvas.getBoundingClientRect();
      W = Math.round(box.width) || window.innerWidth;
      H = Math.round(box.height) || window.innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      R = clamp(Math.min(W, H) * 0.125, 42, 62);
      for (const t of touches.values()) {
        t.x = clamp(t.x, 0, W); t.y = clamp(t.y, 0, H);
        t.dx = clamp(t.dx, 0, W); t.dy = clamp(t.dy, 0, H);
      }
    }

    // ------------------------------------------------------------------
    // HUD (text only; never contains anything about touch order)
    // ------------------------------------------------------------------
    function updateHud() {
      const n = touches.size;
      document.body.dataset.state = phase === 'reveal' ? 'reveal' : (n > 0 ? 'active' : 'idle');
      if (phase === 'reveal') {
        countEl.textContent = '';
        setDigit(null);
        return;
      }
      countEl.textContent = n ? `${n} ${n === 1 ? 'finger' : 'fingers'} detected` : '';
      subEl.textContent = n === 0 ? 'Put a finger on the screen to begin'
        : n < MIN_TOUCHES ? 'Waiting for more fingers…'
        : 'Hold still…';
      if (phase !== 'counting') setDigit(null);
    }

    function setDigit(d) {
      if (d === shownDigit) return;
      shownDigit = d;
      timerEl.textContent = d == null ? '' : String(d);
      timerEl.classList.remove('pop');
      if (d != null) { void timerEl.offsetWidth; timerEl.classList.add('pop'); }
    }

    // ------------------------------------------------------------------
    // Touch bookkeeping
    // ------------------------------------------------------------------
    function restartCountdown() {
      phase = 'counting';
      countdownStart = performance.now();
      setDigit(Math.ceil(COUNTDOWN_MS / 1000));
    }

    function afterTouchSetChanged() {
      if (touches.size >= MIN_TOUCHES) restartCountdown();
      else { phase = 'idle'; }
      updateHud();
    }

    function addTouch(key, x, y, virtual) {
      if (touches.size >= MAX_TOUCHES && !touches.has(key)) return null;
      // A pointerId that shows up again counts as a brand-new placement.
      touches.delete(key);
      const now = performance.now();
      const t = {
        key, x, y, dx: x, dy: y,
        hueIdx: pickHueIdx(),
        placedAt: now,            // when this finger landed (monotonic clock)
        seq: ++seqCounter,        // arrival order, breaks exact timestamp ties
        born: now,
        ph: Math.random() * TAU,
        virtual
      };
      touches.set(key, t);
      buzz(8);
      afterTouchSetChanged();
      return t;
    }

    function removeTouch(key) {
      const t = touches.get(key);
      if (!t) return;
      touches.delete(key);
      ghosts.push({ x: t.dx, y: t.dy, hue: HUES[t.hueIdx], start: performance.now() });
      afterTouchSetChanged();
    }

    function clearTouches() {
      touches.clear();
      drag = null;
      phase = 'idle';
      updateHud();
    }

    // ------------------------------------------------------------------
    // Pointer events
    // ------------------------------------------------------------------
    // Pointer position relative to the canvas (it no longer starts at the top-left of the window).
    function localXY(e) {
      const box = canvas.getBoundingClientRect();
      return [clamp(e.clientX - box.left, 0, W), clamp(e.clientY - box.top, 0, H)];
    }

    function onDown(e) {
      e.preventDefault();
      if (phase === 'reveal') return;
      const [x, y] = localXY(e);

      if (e.pointerType === 'mouse') {
        // Desktop testing aid: a mouse has one pointer, so each click drops a
        // persistent "finger". Click an existing one to remove it, drag to move.
        if (e.button !== 0) return;
        let hit = null;
        const list = [...touches.values()].reverse();
        for (const t of list) {
          if (t.virtual && Math.hypot(t.x - x, t.y - y) < R * 1.15) { hit = t; break; }
        }
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        if (hit) { drag = { key: hit.key, moved: false, isNew: false, sx: x, sy: y }; return; }
        const t = addTouch('m' + (++mouseSeq), x, y, true);
        if (t) drag = { key: t.key, moved: true, isNew: true, sx: x, sy: y };
        return;
      }

      addTouch(e.pointerId, x, y, false);
    }

    function onMove(e) {
      if (phase === 'reveal') return;
      const [x, y] = localXY(e);
      if (e.pointerType === 'mouse') {
        if (!drag) return;
        const t = touches.get(drag.key);
        if (!t) return;
        if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 6) drag.moved = true;
        if (drag.moved) { t.x = x; t.y = y; }
        return;
      }
      const t = touches.get(e.pointerId);
      if (t) { t.x = x; t.y = y; }
    }

    function onUp(e) {
      if (e.pointerType === 'mouse') {
        const d = drag;
        drag = null;
        if (d && !d.isNew && !d.moved && e.type === 'pointerup' && phase !== 'reveal') removeTouch(d.key);
        return;
      }
      if (phase === 'reveal') return;
      removeTouch(e.pointerId);
    }

    canvas.addEventListener('pointerdown', onDown, { passive: false });
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    canvas.addEventListener('lostpointercapture', (e) => {
      // Safety net for touch: if a finger vanishes without pointerup, drop it.
      if (e.pointerType !== 'mouse' && phase !== 'reveal') removeTouch(e.pointerId);
    });

    // Keep the page completely still.
    for (const type of ['contextmenu', 'selectstart', 'dragstart', 'gesturestart', 'gesturechange', 'dblclick']) {
      document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
    }
    document.addEventListener('touchmove', (e) => { if (e.target !== resetBtn) e.preventDefault(); }, { passive: false });
    document.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });

    // If the page loses focus mid-game, forget the fingers rather than act on stale touches.
    const bail = () => { if (phase !== 'reveal' && touches.size) clearTouches(); };
    window.addEventListener('blur', bail);
    document.addEventListener('visibilitychange', () => { if (document.hidden) bail(); });
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    if (typeof ResizeObserver === 'function') new ResizeObserver(resize).observe(document.getElementById('wrap'));

    resetBtn.addEventListener('click', () => {
      reveal = null; ghosts = []; particles = []; rings = []; flash = null;
      resetBtn.classList.remove('visible');
      srEl.textContent = '';
      clearTouches();
    });

    // Mouse-only machines get a small hint line.
    try {
      const mq = (q) => window.matchMedia(q).matches;
      if (mq('(any-pointer: fine)') && !mq('(any-pointer: coarse)')) document.documentElement.classList.add('mouse-only');
    } catch (e) { /* ignore */ }

    // ------------------------------------------------------------------
    // Selection
    // ------------------------------------------------------------------
    function startReveal(now) {
      const list = shuffle([...touches.values()]);

      // ================= SELECTION RULE (never shown in the UI) =================
      // The loser is simply whoever's finger was placed most recently and is
      // still down: the largest placement timestamp. If two timestamps are
      // identical, the later arrival (larger seq) wins the tie, so it is
      // always the last event. Everything the player sees afterwards (spinning
      // colours, the hopping spotlight, the shrinking circles) is theatre that
      // is scripted to end on this circle; nothing about it reflects order.
      let loser = list[0];
      for (const t of list) {
        if (t.placedAt > loser.placedAt || (t.placedAt === loser.placedAt && t.seq > loser.seq)) loser = t;
      }
      // ==========================================================================

      const n = list.length;
      const loserIdx = list.indexOf(loser);

      // Spotlight hops with random-looking order, starting fast and slowing
      // down, ending on the chosen circle.
      const hops = 14 + Math.floor(Math.random() * 5);
      const first = 62, last = 430;
      const g = Math.pow(last / first, 1 / (hops - 1));
      const times = [0];
      for (let k = 0; k < hops; k++) times.push(times[k] + first * Math.pow(g, k));
      const hopIdx = new Array(hops + 1);
      hopIdx[hops] = loserIdx;
      for (let k = hops - 1; k >= 0; k--) {
        let c;
        do { c = Math.floor(Math.random() * n); } while (c === hopIdx[k + 1]);
        hopIdx[k] = c;
      }

      reveal = {
        start: now,
        orbs: list.map((t) => ({
          x: t.x, y: t.y,
          hue: HUES[t.hueIdx],
          s: 1,
          ph: Math.random() * TAU,
          dir: Math.random() < .5 ? -1 : 1
        })),
        loserIdx, hops, times, hopIdx,
        landT: times[hops] + 350,
        active: hopIdx[0],
        lastHop: -1,
        burst: false,
        done: false,
        phrase: PHRASES[Math.floor(Math.random() * PHRASES.length)]
      };

      ghosts = [];
      phase = 'reveal';
      updateHud();
    }

    function burst(now) {
      const o = reveal.orbs[reveal.loserIdx];
      flash = { x: o.x, y: o.y, hue: o.hue, start: now };
      rings.push({ x: o.x, y: o.y, hue: o.hue, start: now, delay: 0 });
      rings.push({ x: o.x, y: o.y, hue: o.hue + 40, start: now, delay: 140 });
      for (let i = 0; i < 80; i++) {
        const a = rand(0, TAU), sp = rand(.15, .8);
        particles.push({
          x: o.x, y: o.y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - .12,
          life: rand(800, 1500), age: 0,
          size: rand(2.5, 6.5),
          hue: reveal.orbs[Math.floor(Math.random() * reveal.orbs.length)].hue
        });
      }
      buzz([30, 40, 70]);
      srEl.textContent = reveal.phrase;
    }

    // ------------------------------------------------------------------
    // Update
    // ------------------------------------------------------------------
    function update(now, dt) {
      const k = 1 - Math.exp(-dt / 32);
      for (const t of touches.values()) {
        t.dx += (t.x - t.dx) * k;
        t.dy += (t.y - t.dy) * k;
      }
      ghosts = ghosts.filter((g) => now - g.start < 260);

      if (phase === 'counting') {
        const el = now - countdownStart;
        if (touches.size >= MIN_TOUCHES && el >= COUNTDOWN_MS) startReveal(now);
        else setDigit(clamp(Math.ceil((COUNTDOWN_MS - el) / 1000), 1, 3));
      }

      if (phase === 'reveal' && reveal) {
        const T = now - reveal.start;
        const landed = T >= reveal.landT;
        let h = 0;
        while (h < reveal.hops && reveal.times[h + 1] <= T) h++;
        reveal.active = reveal.hopIdx[h];
        if (h !== reveal.lastHop) { reveal.lastHop = h; if (!landed) buzz(6); }

        if (landed && !reveal.burst) { reveal.burst = true; burst(now); }
        if (landed && !reveal.done && T >= reveal.landT + 1300) {
          reveal.done = true;
          resetBtn.classList.add('visible');
        }

        reveal.orbs.forEach((o, i) => {
          const isL = i === reveal.loserIdx;
          let target, tau;
          if (!landed) {
            target = i === reveal.active ? 1.28 : .88 + .05 * Math.sin(T / 95 + o.ph);
            tau = 45;
          } else if (isL) {
            target = 2.15 * (1 + .035 * Math.sin((T - reveal.landT) / 240));
            tau = 110;
          } else {
            target = 0;
            tau = 150 + i * 12;
          }
          o.s += (target - o.s) * (1 - Math.exp(-dt / tau));
        });
      }

      for (const p of particles) {
        p.age += dt;
        p.vy += .0007 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      particles = particles.filter((p) => p.age < p.life);
      rings = rings.filter((r) => now - r.start - r.delay < 900);
      if (flash && now - flash.start > 800) flash = null;
    }

    // ------------------------------------------------------------------
    // Drawing
    // ------------------------------------------------------------------
    function drawOrb(x, y, r, hue, alpha, glow) {
      if (r < 0.5 || alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = clamp(alpha, 0, 1);

      // soft halo
      let g = ctx.createRadialGradient(x, y, r * .55, x, y, r * 2.2);
      g.addColorStop(0, hsl(hue, 95, 60, .45 * glow));
      g.addColorStop(1, hsl(hue, 95, 60, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, TAU); ctx.fill();

      // glossy body
      g = ctx.createRadialGradient(x - r * .35, y - r * .42, r * .05, x, y, r);
      g.addColorStop(0, hsl(hue, 100, 90));
      g.addColorStop(.38, hsl(hue, 95, 62));
      g.addColorStop(1, hsl(hue, 90, 40));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();

      // rim light
      ctx.lineWidth = 2;
      ctx.strokeStyle = hsl(hue, 100, 88, .5);
      ctx.stroke();

      // top gloss
      ctx.fillStyle = 'rgba(255,255,255,.34)';
      ctx.beginPath();
      ctx.ellipse(x - r * .16, y - r * .52, r * .5, r * .24, -.32, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    function drawAmbient(now) {
      if (idleAlpha < .01) return;
      const s = R / 52;
      for (const a of AMBIENT) {
        const x = a.fx * W + Math.sin(now / 2400 + a.ph) * 16;
        const y = a.fy * H + Math.cos(now / 2900 + a.ph * 1.7) * 16;
        drawOrb(x, y, a.r * s * (1 + .05 * Math.sin(now / 900 + a.ph)), a.hue, idleAlpha * .3, .6);
      }
    }

    function drawTouches(now) {
      const counting = phase === 'counting';
      for (const g of ghosts) {
        const e = clamp((now - g.start) / 260, 0, 1);
        drawOrb(g.x, g.y, R * (1 - .6 * e), g.hue, 1 - e, 1);
      }
      for (const t of touches.values()) {
        const hue = HUES[t.hueIdx];
        const age = now - t.born;
        const s = Math.max(0, easeOutBack(clamp(age / 380, 0, 1))) * (1 + .045 * Math.sin(now / (counting ? 140 : 340) + t.ph));
        drawOrb(t.dx, t.dy, R * s, hue, 1, 1);

        if (age < 600) { // ripple on arrival
          const e = age / 600;
          ctx.strokeStyle = hsl(hue, 100, 80, .55 * (1 - e));
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(t.dx, t.dy, R * (1 + e * 1.1), 0, TAU); ctx.stroke();
        }
        if (counting) { // same progress ring on every circle
          const p = clamp((now - countdownStart) / COUNTDOWN_MS, 0, 1);
          ctx.lineCap = 'round';
          ctx.lineWidth = 4;
          ctx.strokeStyle = 'rgba(255,255,255,.14)';
          ctx.beginPath(); ctx.arc(t.dx, t.dy, R + 10, 0, TAU); ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,.9)';
          ctx.beginPath(); ctx.arc(t.dx, t.dy, R + 10, -Math.PI / 2, -Math.PI / 2 + TAU * p); ctx.stroke();
        }
      }
    }

    function drawReveal(now) {
      const T = now - reveal.start;
      const landed = T >= reveal.landT;
      const L = T - reveal.landT;

      // Colour flash behind everything
      if (flash) {
        const e = clamp((now - flash.start) / 800, 0, 1);
        const g = ctx.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, Math.max(W, H) * (.35 + .6 * e));
        g.addColorStop(0, hsl(flash.hue, 100, 65, .38 * (1 - e)));
        g.addColorStop(1, hsl(flash.hue, 100, 65, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      // Spinning colours: hue rotation that eases off, then settles to true colour.
      let shift = T * .5 * (1 - .55 * Math.min(T / reveal.landT, 1));
      if (landed) shift *= 1 - clamp(L / 600, 0, 1);

      reveal.orbs.forEach((o, i) => {
        const isL = i === reveal.loserIdx;
        const isActive = i === reveal.active;
        const hue = o.hue + shift;
        const alpha = (landed && !isL) ? clamp(o.s / .5, 0, 1) : (isActive ? 1 : .8);
        const r = R * o.s;
        drawOrb(o.x, o.y, r, hue, alpha, isActive ? 2 : 1);
        if (r < 2) return;

        // orbiting arcs (spin)
        const a = o.dir * T / 240 + o.ph;
        ctx.lineCap = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = `rgba(255,255,255,${(.7 * alpha).toFixed(3)})`;
        for (let q = 0; q < 2; q++) {
          ctx.beginPath();
          ctx.arc(o.x, o.y, r * 1.22 + 6, a + q * Math.PI, a + q * Math.PI + 1.05);
          ctx.stroke();
        }
        // spotlight ring
        if (isActive) {
          ctx.lineWidth = 3;
          ctx.strokeStyle = `rgba(255,255,255,${(.5 + .4 * Math.sin(T / 60)).toFixed(3)})`;
          ctx.beginPath(); ctx.arc(o.x, o.y, r * 1.1 + 12, 0, TAU); ctx.stroke();
        }
      });

      // Shockwaves
      for (const rg of rings) {
        const e = (now - rg.start - rg.delay) / 900;
        if (e < 0) continue;
        ctx.lineWidth = 4 * (1 - e) + 1;
        ctx.strokeStyle = hsl(rg.hue, 100, 78, .7 * (1 - e));
        ctx.beginPath(); ctx.arc(rg.x, rg.y, R * (1.5 + e * 7), 0, TAU); ctx.stroke();
      }

      // Confetti sparks
      for (const p of particles) {
        const f = 1 - p.age / p.life;
        ctx.fillStyle = hsl(p.hue, 100, 68, clamp(f * 1.4, 0, 1));
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.4 + .6 * f), 0, TAU); ctx.fill();
      }

      // Result text over the circle
      if (landed && L > 250) {
        const o = reveal.orbs[reveal.loserIdx];
        const e = clamp((L - 250) / 450, 0, 1);
        let fs = clamp(W * .115, 34, 66);
        ctx.save();
        ctx.font = `900 ${fs}px ${FONT}`;
        const w = ctx.measureText(reveal.phrase).width;
        if (w > W - 40) { fs *= (W - 40) / w; ctx.font = `900 ${fs}px ${FONT}`; }
        const tw = ctx.measureText(reveal.phrase).width;
        const cx = clamp(o.x, tw / 2 + 20, W - tw / 2 - 20);
        const cy = clamp(o.y, fs, H - fs);
        ctx.globalAlpha = e;
        ctx.translate(cx, cy);
        const sc = Math.max(0, easeOutBack(e)) * (1 + .02 * Math.sin(L / 300));
        ctx.scale(sc, sc);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = fs * .17;
        ctx.strokeStyle = hsl(o.hue, 80, 22, .95);
        ctx.shadowColor = 'rgba(0,0,0,.5)';
        ctx.shadowBlur = 24;
        ctx.strokeText(reveal.phrase, 0, 0);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.fillText(reveal.phrase, 0, 0);
        ctx.restore();
      }
    }

    // ------------------------------------------------------------------
    // Main loop
    // ------------------------------------------------------------------
    let lastFrame = performance.now();
    function frame(now) {
      const dt = Math.min(64, Math.max(0, now - lastFrame));
      lastFrame = now;
      idleAlpha += ((phase === 'idle' && touches.size === 0 ? 1 : 0) - idleAlpha) * (1 - Math.exp(-dt / 280));
      update(now, dt);
      ctx.clearRect(0, 0, W, H);
      drawAmbient(now);
      if (phase === 'reveal' && reveal) drawReveal(now); else drawTouches(now);
      requestAnimationFrame(frame);
    }

    resize();
    updateHud();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
